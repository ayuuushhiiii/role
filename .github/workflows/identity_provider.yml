name: Deploy github action resources using Terraform

# Trigger the workflow on pull request merged
on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  terraform:
    if: github.event.pull_request.merged == true
    name: Deploy AWS Resources using Terraform
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: accounts/netzero

      # Formatting the terraform files
      - name: Terraform Fmt (format the files)
        run: terraform fmt -recursive
        working-directory: accounts/netzero

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan
        working-directory: accounts/netzero

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: accounts/netzero
